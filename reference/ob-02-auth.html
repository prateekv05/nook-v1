<!DOCTYPE html>
<html lang="en" data-theme="calm">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nook — Sign in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<script src="https://unpkg.com/@phosphor-icons/web"></script>
<style>

/* ════════════════════════════════════════
   Z-INDEX SCALE
   ════════════════════════════════════════ */
:root {
  --z-base:   1;
  --z-sticky: 10;
  --z-modal:  100;
  --z-toast:  200;
}

/* ════════════════════════════════════════
   THEME TOKENS
   ════════════════════════════════════════ */
[data-theme="calm"] {
  --app-bg:      #F7F3EE;
  --main-bg:     #F0EAE1;
  --card-bg:     #FDFCFA;
  --input-bg:    #EDE7DE;
  --sidebar-bg:  #EDE7DE;
  --sb-logo-bg:  #1C1410;
  --sb-logo-fg:  #F7F3EE;
  --sb-name:     #1C1410;
  --border:      rgba(28,20,16,0.10);
  --border-hov:  rgba(28,20,16,0.18);
  --text-1:      #1C1410;
  --text-2:      #6B5E54;
  --text-3:      #A8998E;
  --accent:      #C2623F;
  --accent-bg:   rgba(194,98,63,0.08);
  --accent-bdr:  rgba(194,98,63,0.20);
  --card-sh:     0 20px 40px -15px rgba(28,20,16,0.07);
  --hero-hov-sh: 0 20px 40px -15px rgba(28,20,16,0.10);
  --sub-divider: rgba(28,20,16,0.06);
}
[data-theme="regular"] {
  --app-bg:      #EEF0F5;
  --main-bg:     #E4E7F0;
  --card-bg:     #F8F9FC;
  --input-bg:    #E4E7F0;
  --sb-logo-bg:  #151820;
  --sb-logo-fg:  #EEF0F5;
  --sb-name:     #151820;
  --border:      rgba(21,24,32,0.10);
  --border-hov:  rgba(21,24,32,0.18);
  --text-1:      #151820;
  --text-2:      #5A6070;
  --text-3:      #939BAA;
  --accent:      #3D6BE8;
  --accent-bg:   rgba(61,107,232,0.08);
  --accent-bdr:  rgba(61,107,232,0.20);
  --card-sh:     0 20px 40px -15px rgba(21,24,32,0.08);
  --hero-hov-sh: 0 20px 40px -15px rgba(21,24,32,0.12);
  --sub-divider: rgba(21,24,32,0.06);
}
[data-theme="dark"] {
  --app-bg:      #0E0F13;
  --main-bg:     #111318;
  --card-bg:     #181B22;
  --input-bg:    #1E2230;
  --sb-logo-bg:  #E8A055;
  --sb-logo-fg:  #0E0F13;
  --sb-name:     #F2F0EC;
  --border:      rgba(242,240,236,0.08);
  --border-hov:  rgba(242,240,236,0.15);
  --text-1:      #F2F0EC;
  --text-2:      #8A8880;
  --text-3:      #555350;
  --accent:      #E8A055;
  --accent-bg:   rgba(232,160,85,0.10);
  --accent-bdr:  rgba(232,160,85,0.22);
  --card-sh:     0 20px 40px -15px rgba(0,0,0,0.30);
  --hero-hov-sh: 0 20px 40px -15px rgba(0,0,0,0.40);
  --sub-divider: rgba(242,240,236,0.05);
}

:root {
  --font-sans:   'Geist', sans-serif;
  --font-serif:  'Lora', serif;
  --ease-spring: cubic-bezier(0.16, 1, 0.3, 1);
}

/* ════════════════════════════════════════
   ANIMATIONS
   ════════════════════════════════════════ */
@keyframes fade-up {
  from { opacity: 0; transform: translateY(14px); }
  to   { opacity: 1; transform: translateY(0); }
}
@keyframes shake {
  0%, 100% { transform: translateX(0); }
  20%       { transform: translateX(-5px); }
  40%       { transform: translateX(5px); }
  60%       { transform: translateX(-4px); }
  80%       { transform: translateX(4px); }
}

/* ════════════════════════════════════════
   BASE RESET
   ════════════════════════════════════════ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: var(--font-sans);
  background: var(--app-bg);
  min-height: 100dvh;
  display: flex;
  align-items: flex-start;
  justify-content: center;
  transition: background 0.3s;
}

::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border-hov); border-radius: 2px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ════════════════════════════════════════
   PAGE SHELL
   ════════════════════════════════════════ */
.ob-page {
  width: 100%;
  max-width: 430px;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  padding: 28px 24px 0;
}

/* ── Top nav ── */
.ob-topnav {
  display: flex;
  align-items: center;
  margin-bottom: 44px;
  animation: fade-up 0.4s var(--ease-spring) both;
}

.ob-back-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 34px;
  height: 34px;
  border-radius: 10px;
  background: var(--card-bg);
  border: 0.5px solid var(--border);
  box-shadow: var(--card-sh);
  cursor: pointer;
  text-decoration: none;
  transition: all 0.25s var(--ease-spring);
}
.ob-back-btn:hover  { background: var(--input-bg); border-color: var(--border-hov); }
.ob-back-btn:active { transform: scale(0.95); }
.ob-back-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.ob-back-btn i { font-size: 17px; color: var(--text-2); }

/* ── Heading ── */
.ob-heading-block {
  margin-bottom: 32px;
  animation: fade-up 0.45s var(--ease-spring) 0.05s both;
}
.ob-headline {
  font-family: var(--font-serif);
  font-size: 36px;
  font-weight: 400;
  color: var(--text-1);
  letter-spacing: -0.02em;
  line-height: 1.1;
  margin-bottom: 6px;
}
.ob-subtext {
  font-size: 14px;
  color: var(--text-2);
  line-height: 1.6;
}

/* ── Mode tabs ── */
.ob-mode-tabs {
  display: flex;
  background: var(--input-bg);
  border-radius: 12px;
  padding: 3px;
  gap: 2px;
  margin-bottom: 28px;
  animation: fade-up 0.45s var(--ease-spring) 0.08s both;
}
.ob-mode-tab {
  flex: 1;
  padding: 9px 12px;
  border-radius: 9px;
  border: none;
  background: transparent;
  font-size: 13px;
  font-weight: 500;
  font-family: var(--font-sans);
  color: var(--text-3);
  cursor: pointer;
  transition: all 0.25s var(--ease-spring);
}
.ob-mode-tab:active { transform: scale(0.97); }
.ob-mode-tab.active {
  background: var(--card-bg);
  color: var(--text-1);
  box-shadow: 0 1px 4px rgba(0,0,0,0.08), 0 0 0 0.5px var(--border);
}

/* ── Form ── */
.ob-form {
  display: flex;
  flex-direction: column;
  gap: 10px;
  animation: fade-up 0.45s var(--ease-spring) 0.11s both;
}
.ob-form.shake { animation: shake 0.35s var(--ease-spring); }

.ob-field {
  display: flex;
  flex-direction: column;
  gap: 5px;
}
.ob-field-label {
  font-size: 12px;
  font-weight: 500;
  color: var(--text-2);
  letter-spacing: 0.01em;
}
.ob-input-wrap {
  position: relative;
  display: flex;
  align-items: center;
}
.ob-input {
  width: 100%;
  border: 0.5px solid var(--border);
  border-radius: 12px;
  padding: 12px 14px;
  font-size: 14px;
  font-family: var(--font-sans);
  color: var(--text-1);
  background: var(--card-bg);
  outline: none;
  transition: border-color 0.2s, box-shadow 0.2s, background 0.3s;
}
.ob-input::placeholder { color: var(--text-3); }
.ob-input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-bg);
}
.ob-input:focus-visible { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-bg); }
.ob-input.has-action { padding-right: 44px; }

.ob-input-action {
  position: absolute;
  right: 12px;
  width: 28px;
  height: 28px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  border-radius: 6px;
  color: var(--text-3);
  background: none;
  border: none;
  transition: color 0.2s;
}
.ob-input-action:hover { color: var(--text-2); }
.ob-input-action i { font-size: 16px; }

.ob-forgot {
  font-size: 12px;
  color: var(--accent);
  text-decoration: none;
  text-align: right;
  margin-top: -4px;
  display: block;
  transition: opacity 0.2s;
}
.ob-forgot:hover { opacity: 0.75; }

/* ── Submit button ── */
.ob-submit-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  width: 100%;
  background: var(--accent);
  color: #fff;
  border: none;
  border-radius: 999px;
  padding: 14px 20px;
  font-size: 15px;
  font-weight: 500;
  font-family: var(--font-sans);
  cursor: pointer;
  margin-top: 6px;
  transition: all 0.3s var(--ease-spring);
  box-shadow: 0 8px 24px -8px rgba(194,98,63,0.40);
}
[data-theme="regular"] .ob-submit-btn { box-shadow: 0 8px 24px -8px rgba(61,107,232,0.35); }
[data-theme="dark"]    .ob-submit-btn { box-shadow: 0 8px 24px -8px rgba(232,160,85,0.35); }
.ob-submit-btn:hover  { opacity: 0.90; transform: translateY(-1px); }
.ob-submit-btn:active { transform: scale(0.97) translateY(0); }
.ob-submit-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

/* ── Divider ── */
.ob-divider {
  display: flex;
  align-items: center;
  gap: 12px;
  margin: 24px 0;
  animation: fade-up 0.45s var(--ease-spring) 0.14s both;
}
.ob-divider-line { flex: 1; height: 0.5px; background: var(--border); }
.ob-divider-text {
  font-size: 11px;
  color: var(--text-3);
  text-transform: uppercase;
  letter-spacing: 0.1em;
  font-weight: 500;
}

/* ── Social buttons ── */
.ob-social-row {
  display: flex;
  gap: 10px;
  animation: fade-up 0.45s var(--ease-spring) 0.17s both;
}
.ob-social-btn {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 12px 16px;
  border-radius: 12px;
  border: 0.5px solid var(--border);
  background: var(--card-bg);
  box-shadow: var(--card-sh);
  cursor: pointer;
  text-decoration: none;
  font-size: 13px;
  font-weight: 500;
  font-family: var(--font-sans);
  color: var(--text-1);
  transition: all 0.25s var(--ease-spring);
}
.ob-social-btn:hover  { border-color: var(--border-hov); transform: translateY(-1px); box-shadow: var(--hero-hov-sh); }
.ob-social-btn:active { transform: scale(0.97) translateY(0); }
.ob-social-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.ob-social-btn i { font-size: 18px; }
.ob-social-btn.google i { color: #EA4335; }
.ob-social-btn.apple i  { color: var(--text-1); }

/* ── Bottom link ── */
.ob-bottom-link {
  text-align: center;
  font-size: 13px;
  color: var(--text-3);
  text-decoration: none;
  padding-bottom: 32px;
  margin-top: auto;
  padding-top: 20px;
  animation: fade-up 0.45s var(--ease-spring) 0.20s both;
}
.ob-bottom-link span {
  color: var(--accent);
  font-weight: 500;
  text-decoration: underline;
  text-underline-offset: 2px;
}
.ob-bottom-link:hover span { opacity: 0.8; }

/* Hidden/shown by mode */
.signup-only { display: none; }
.signin-only { display: block; }

</style>
</head>
<body>

<main class="ob-page">

  <!-- Top nav -->
  <nav class="ob-topnav">
    <a href="ob-01-welcome.html" class="ob-back-btn" aria-label="Go back">
      <i class="ph-bold ph-arrow-left"></i>
    </a>
  </nav>

  <!-- Heading -->
  <div class="ob-heading-block">
    <h1 class="ob-headline" id="ob-headline">Welcome back.</h1>
    <p class="ob-subtext" id="ob-subtext">Sign in to your Nook account.</p>
  </div>

  <!-- Mode tabs -->
  <div class="ob-mode-tabs" role="tablist">
    <button class="ob-mode-tab active" id="tab-signin" role="tab" onclick="switchMode('signin')">Sign in</button>
    <button class="ob-mode-tab" id="tab-signup" role="tab" onclick="switchMode('signup')">Create account</button>
  </div>

  <!-- Form -->
  <form class="ob-form" id="ob-form" onsubmit="handleSubmit(event)" novalidate>

    <!-- Username (signup only) -->
    <div class="ob-field signup-only" id="username-field">
      <label class="ob-field-label" for="username">Username</label>
      <div class="ob-input-wrap">
        <input class="ob-input" type="text" id="username" name="username" placeholder="alexlewis" autocomplete="username">
      </div>
    </div>

    <!-- DOB (signup only) -->
    <div class="ob-field signup-only" id="dob-field">
      <label class="ob-field-label" for="dob">Date of birth</label>
      <div class="ob-input-wrap">
        <input class="ob-input" type="date" id="dob" name="dob">
      </div>
    </div>

    <!-- Email (signin only) -->
    <div class="ob-field signin-only" id="email-field">
      <label class="ob-field-label" for="email">Email</label>
      <div class="ob-input-wrap">
        <input class="ob-input" type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email">
      </div>
    </div>

    <!-- Password -->
    <div class="ob-field">
      <label class="ob-field-label" for="password">Password</label>
      <div class="ob-input-wrap">
        <input class="ob-input has-action" type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password">
        <button type="button" class="ob-input-action" onclick="togglePassword()" aria-label="Show password" id="pw-toggle">
          <i class="ph-bold ph-eye" id="pw-icon"></i>
        </button>
      </div>
    </div>

    <!-- Confirm password (signup only) -->
    <div class="ob-field signup-only" id="confirm-password-field">
      <label class="ob-field-label" for="confirm-password">Confirm password</label>
      <div class="ob-input-wrap">
        <input class="ob-input has-action" type="password" id="confirm-password" name="confirm-password" placeholder="••••••••" autocomplete="new-password">
        <button type="button" class="ob-input-action" onclick="toggleConfirmPassword()" aria-label="Show password" id="cpw-toggle">
          <i class="ph-bold ph-eye" id="cpw-icon"></i>
        </button>
      </div>
    </div>

    <!-- Forgot (signin only) -->
    <a href="#" class="ob-forgot signin-only" id="forgot-link">Forgot password?</a>

    <button type="submit" class="ob-submit-btn" id="submit-btn">
      Sign in
    </button>
  </form>

  <!-- Divider -->
  <div class="ob-divider">
    <div class="ob-divider-line"></div>
    <span class="ob-divider-text">or continue with</span>
    <div class="ob-divider-line"></div>
  </div>

  <!-- Social -->
  <div class="ob-social-row">
    <a href="#" class="ob-social-btn google">
      <i class="ph-bold ph-google-logo"></i>
      Google
    </a>
    <a href="#" class="ob-social-btn apple">
      <i class="ph-bold ph-apple-logo"></i>
      Apple
    </a>
  </div>

  <!-- Bottom link -->
  <a href="#" class="ob-bottom-link" id="bottom-link" onclick="switchMode('signup'); return false;">
    New here? <span>Create account</span>
  </a>

</main>

<script>
  let mode = 'signin';

  function switchMode(m) {
    mode = m;
    const isSignup = m === 'signup';

    document.getElementById('tab-signin').classList.toggle('active', !isSignup);
    document.getElementById('tab-signup').classList.toggle('active', isSignup);

    document.getElementById('ob-headline').textContent = isSignup ? 'Create account.' : 'Welcome back.';
    document.getElementById('ob-subtext').textContent  = isSignup ? 'Start your Nook journey.' : 'Sign in to your Nook account.';
    document.getElementById('submit-btn').textContent  = isSignup ? 'Create account' : 'Sign in';
    document.getElementById('password').autocomplete   = isSignup ? 'new-password' : 'current-password';

    document.querySelectorAll('.signup-only').forEach(el => {
      el.style.display = isSignup ? 'block' : 'none';
    });
    document.querySelectorAll('.signin-only').forEach(el => {
      el.style.display = isSignup ? 'none' : 'block';
    });

    const link = document.getElementById('bottom-link');
    if (isSignup) {
      link.innerHTML = 'Already have an account? <span>Sign in</span>';
      link.onclick = () => { switchMode('signin'); return false; };
    } else {
      link.innerHTML = 'New here? <span>Create account</span>';
      link.onclick = () => { switchMode('signup'); return false; };
    }
  }

  function togglePassword() {
    const input = document.getElementById('password');
    const icon  = document.getElementById('pw-icon');
    const shown = input.type === 'text';
    input.type  = shown ? 'password' : 'text';
    icon.className = shown ? 'ph-bold ph-eye' : 'ph-bold ph-eye-slash';
  }

  function toggleConfirmPassword() {
    const input = document.getElementById('confirm-password');
    const icon  = document.getElementById('cpw-icon');
    const shown = input.type === 'text';
    input.type  = shown ? 'password' : 'text';
    icon.className = shown ? 'ph-bold ph-eye' : 'ph-bold ph-eye-slash';
  }

  function handleSubmit(e) {
    e.preventDefault();
    const form = document.getElementById('ob-form');

    function shake() {
      form.classList.remove('shake');
      void form.offsetWidth;
      form.classList.add('shake');
    }

    if (mode === 'signup') {
      const username = document.getElementById('username').value.trim();
      const dob      = document.getElementById('dob').value;
      const pass     = document.getElementById('password').value;
      const confirm  = document.getElementById('confirm-password').value;
      if (!username || !dob || !pass || !confirm) { shake(); return; }
      if (pass !== confirm) { shake(); return; }
      window.location.href = 'ob-03-signup.html';
    } else {
      const email = document.getElementById('email').value.trim();
      const pass  = document.getElementById('password').value;
      if (!email || !pass) { shake(); return; }
      window.location.href = 'ob-04-name.html';
    }
  }
</script>
</body>
</html>
